
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Center Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 520px;
  margin: 20px auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px #0001;
}

h2, p { text-align: center; }
p { color: #64748b; }

button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border-radius: 9px;
  font-size: 15px;
}

button {
  border: 0;
  color: white;
  background: #2563eb;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
}

#reader {
  margin: 15px auto;
  overflow: hidden;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

  <h2>📷 App Center Scanner</h2>
  <p>QR Code & Barcode Scanner</p>

  <button id="startBtn" onclick="startScanner()" hidden>
    แตะเพื่ออนุญาตใช้กล้อง
  </button>

  <div id="reader"></div>

  <div class="status" id="status">
    พร้อมเริ่มสแกน
  </div>

</div>

<script>

let scanner = null;
let scanning = false;
let scannerStarting = false;
let stopRequested = false;
let lastResult = "";

const formats = [
  Html5QrcodeSupportedFormats.QR_CODE,
  Html5QrcodeSupportedFormats.AZTEC,
  Html5QrcodeSupportedFormats.CODABAR,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.CODE_93,
  Html5QrcodeSupportedFormats.DATA_MATRIX,
  Html5QrcodeSupportedFormats.MAXICODE,
  Html5QrcodeSupportedFormats.ITF,
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.PDF_417,
  Html5QrcodeSupportedFormats.RSS_14,
  Html5QrcodeSupportedFormats.RSS_EXPANDED,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.UPC_EAN_EXTENSION
];

const config = {
  fps: 10,
  qrbox: (width, height) => ({
    width: Math.floor(width * 0.92),
    height: Math.floor(height * 0.72)
  }),
  formatsToSupport: formats
};

function status(text) {
  document.getElementById("status").textContent = text;
}

async function startScanner() {
  if (scanning || scannerStarting) return;
  const startBtn = document.getElementById("startBtn");
  startBtn.hidden = true;
  startBtn.disabled = true;

  try {
    status("กำลังเปิดกล้อง...");
    if (!window.isSecureContext) {
      throw new Error("กรุณาเปิด Scanner ผ่าน HTTPS");
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Browser นี้ไม่รองรับการเปิดกล้อง");
    }
    if (typeof Html5Qrcode === "undefined") {
      throw new Error("โหลดระบบสแกนไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
    }

    const activeScanner = new Html5Qrcode("reader", {
      formatsToSupport: formats,
      verbose: false
    });
    scanner = activeScanner;
    scannerStarting = true;
    stopRequested = false;

    await activeScanner.start(
      { facingMode: "environment" },
      config,

      (decodedText) => {
        if (!decodedText || lastResult) return;
        lastResult = decodedText;
        status("พบรหัสแล้ว กำลังส่งกลับ...");
        if (scannerStarting) {
          stopRequested = true;
          return;
        }
        void finishSuccessfulScan();
      },
      () => {}
    );

    scannerStarting = false;
    scanning = true;

    document.getElementById("startBtn").disabled = true;

    if (stopRequested) {
      stopRequested = false;
      await stopScanner();
      if (lastResult) await sendResult();
      return;
    }

    status("กำลังสแกน...");

  } catch (error) {
    console.error(error);
    scannerStarting = false;
    scanning = false;
    stopRequested = false;
    if (scanner) await stopScanner();
    startBtn.hidden = false;
    startBtn.disabled = false;
    status(error.name === "NotAllowedError" || error.name === "PermissionDeniedError"
      ? "กรุณาอนุญาตใช้กล้อง แล้วแตะปุ่มด้านล่าง"
      : "เปิดกล้องไม่สำเร็จ: " + error.message);
  }
}

async function finishSuccessfulScan() {
  await stopScanner();
  await sendResult();
}

// หยุดกล้อง
async function stopScanner() {

  if (!scanner) return;

  // Wait until start() resolves before stopping the camera.
  if (scannerStarting) {
    stopRequested = true;
    return;
  }

  const activeScanner = scanner;

  try {

    if (scanning) {
      await activeScanner.stop();
    }

    await activeScanner.clear();

  } catch (error) {

    console.error(error);

    // Force-release the camera if the library stop call fails.
    const video = document.querySelector("#reader video");
    if (video && video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }

    try {
      await activeScanner.clear();
    } catch (cleanupError) {
      console.error(cleanupError);
    }

  }

  scanning = false;
  scannerStarting = false;
  stopRequested = false;
  if (scanner === activeScanner) scanner = null;

  document.getElementById("startBtn").disabled = false;

}



function closeScannerPage() {
  status("สแกนสำเร็จ กำลังปิด Scanner...");

  window.close();
}



// ส่งข้อมูลกลับ Apps Script

async function sendResult() {

  if (!lastResult) {
    status("ยังไม่มีข้อมูลสำหรับส่ง");
    return;
  }

  const params = new URLSearchParams(
    window.location.search
  );

  const sessionId = params.get("sessionId");
  const api = params.get("api");

  // ส่งผ่าน Apps Script API
  if (sessionId && api) {

    try {

      status("กำลังส่งข้อมูลกลับ Apps Script...");

      await fetch(api, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          secret: "CHANGE_THIS_TO_YOUR_SECRET_2026",
          sessionId: sessionId,
          value: lastResult
        })
      });

      status("ส่งคำขอแล้ว กำลังปิด Scanner...");

      closeScannerPage();

    } catch (error) {

      status("ส่งข้อมูลไม่สำเร็จ: " + error.message);

    }

    return;
  }

  status("ไม่พบ API URL หรือหน้า Apps Script");

}


window.addEventListener("load", startScanner, { once: true });

// หยุดกล้องเมื่อออกจากหน้า
window.addEventListener("pagehide", () => {

  if (scanner && scanning) {
    scanner.stop().catch(console.error);
  }

});

</script>

</body>
</html>
