
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Center Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 520px;
  margin: 20px auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px #0001;
}

h2, p { text-align: center; }
p { color: #64748b; }

button, select {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border-radius: 9px;
  font-size: 15px;
}

button {
  border: 0;
  color: white;
  background: #2563eb;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.stop { background: #dc2626; }

.result {
  background: #f1f5f9;
  padding: 15px;
  border-radius: 10px;
  word-break: break-all;
}

.status {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
}

#reader {
  margin: 15px auto;
  overflow: hidden;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

  <h2>📷 App Center Scanner</h2>
  <p>QR Code & Barcode Scanner</p>

  <select id="cameraSelect" disabled>
    <option value="">กดเริ่มสแกนเพื่อเปิดกล้อง</option>
  </select>

  <button id="startBtn" onclick="startScanner()">
    ▶ เริ่มสแกน / อนุญาตใช้กล้อง
  </button>

  <button class="stop" onclick="stopScanner()">
    ■ หยุดกล้อง
  </button>

  <div id="reader"></div>

  <h3>ผลการสแกน</h3>

  <div class="result" id="resultText">
    ยังไม่มีข้อมูล
  </div>

  <div class="status" id="status">
    พร้อมเริ่มสแกน
  </div>

  <button onclick="sendAgain()" style="background:#059669">
    ส่งค่ากลับ Apps Script อีกครั้ง
  </button>

  <button onclick="window.close()" style="background:#64748b">
    ปิดหน้าสแกน
  </button>

</div>

<script>

let scanner = null;
let scanning = false;
let lastResult = "";
let sent = false;

const formats = [
  Html5QrcodeSupportedFormats.QR_CODE,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.ITF,
  Html5QrcodeSupportedFormats.PDF_417,
  Html5QrcodeSupportedFormats.DATA_MATRIX
];

const config = {
  fps: 10,
  qrbox: { width: 250, height: 250 },
  formatsToSupport: formats
};

function status(text) {
  document.getElementById("status").textContent = text;
}

// ขอสิทธิ์กล้องเมื่อผู้ใช้กดปุ่มเท่านั้น
async function startScanner() {

  if (scanning) return;

  if (!window.isSecureContext) {
    status("กรุณาเปิด Scanner ผ่าน HTTPS");
    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    status("Browser นี้ไม่รองรับการเปิดกล้อง");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    status("โหลดระบบสแกนไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
    return;
  }

  const startBtn = document.getElementById("startBtn");
  const select = document.getElementById("cameraSelect");

  startBtn.disabled = true;

  try {

    status("กำลังขออนุญาตใช้กล้อง...");

    // ขอสิทธิ์กล้องโดยตรง
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    // ปิด stream ชั่วคราวเพื่อให้ html5-qrcode เปิดกล้องเอง
    stream.getTracks().forEach(track => track.stop());

    status("ได้รับอนุญาตแล้ว กำลังค้นหากล้อง...");

    // เมื่อได้รับสิทธิ์แล้วจึงค้นหารายชื่อกล้อง
    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("ไม่พบกล้องที่เชื่อมต่อ");
    }

    select.innerHTML = "";

    cameras.forEach((camera, index) => {

      const option = document.createElement("option");

      option.value = camera.id;
      option.textContent =
        camera.label || "Camera " + (index + 1);

      select.appendChild(option);

    });

    select.disabled = false;

    // เลือกกล้องหลังเครื่อง ถ้ามี
    const preferred = cameras.find(camera =>
      /back|rear|environment|หลัง/i.test(camera.label)
    );

    if (preferred) {
      select.value = preferred.id;
    }

    await openSelectedCamera();

  } catch (error) {

    console.error(error);

    if (error.name === "NotAllowedError" ||
        error.name === "PermissionDeniedError") {

      status("ไม่ได้รับอนุญาตใช้กล้อง กรุณาอนุญาตใน Browser");

    } else if (error.name === "NotFoundError") {

      status("ไม่พบกล้อง กรุณาตรวจสอบ Webcam");

    } else if (error.name === "NotReadableError") {

      status("กล้องกำลังถูกใช้งานโดยโปรแกรมอื่น");

    } else {

      status("เปิดกล้องไม่สำเร็จ: " + error.message);

    }

  } finally {

    startBtn.disabled = scanning;

  }
}

// เปิดกล้องที่เลือก
async function openSelectedCamera() {

  if (scanning) return;

  const cameraId =
    document.getElementById("cameraSelect").value;

  if (!cameraId) {
    status("กรุณาเลือกกล้อง");
    return;
  }

  try {

    status("กำลังเปิดกล้อง...");

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: formats,
      verbose: false
    });

    await scanner.start(
      cameraId,
      config,

      async (decodedText) => {

        if (lastResult) return;

        lastResult = decodedText;

        document.getElementById("resultText").textContent =
          decodedText;

        await stopScanner();

        sendAgain();

      },

      () => {}

    );

    scanning = true;

    document.getElementById("startBtn").disabled = true;

    status("กำลังสแกน...");

  } catch (error) {

    console.error(error);

    scanner = null;
    scanning = false;

    document.getElementById("startBtn").disabled = false;

    status("เปิดกล้องไม่สำเร็จ: " + error.message);

  }

}

// เปลี่ยนกล้อง
document.getElementById("cameraSelect").addEventListener(
  "change",
  async function() {

    if (scanning) {
      await stopScanner();
      await openSelectedCamera();
    }

  }
);

// หยุดกล้อง
async function stopScanner() {

  if (!scanner) return;

  try {

    if (scanning) {
      await scanner.stop();
    }

    await scanner.clear();

  } catch (error) {

    console.error(error);

  }

  scanning = false;
  scanner = null;

  document.getElementById("startBtn").disabled = false;

}


function closeScannerPage() {
  setTimeout(() => {
    window.close();

    // กรณี Browser ไม่อนุญาตให้ปิดแท็บ
    status("ส่งข้อมูลแล้ว กรุณาปิดแท็บนี้");
  }, 800);
}

  

  
// ส่งข้อมูลกลับ Apps Script

async function sendAgain() {

  if (!lastResult) {
    status("ยังไม่มีข้อมูลสำหรับส่ง");
    return;
  }

  const params = new URLSearchParams(
    window.location.search
  );

  const sessionId = params.get("sessionId");
  const api = params.get("api");

  // ส่งผ่าน Apps Script API
  if (sessionId && api) {

    try {

      status("กำลังส่งข้อมูลกลับ Apps Script...");

      await fetch(api, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          secret: "CHANGE_THIS_TO_YOUR_SECRET_2026",
          sessionId: sessionId,
          value: lastResult
        })
      });

      sent = true;

      status("ส่งคำขอแล้ว กำลังปิด Scanner...");

      closeScannerPage();

    } catch (error) {

      status("ส่งข้อมูลไม่สำเร็จ: " + error.message);

    }

    return;
  }

  // ส่งผ่านหน้า Apps Script แบบเดิม
  if (window.opener && !window.opener.closed) {

    window.opener.postMessage({
      type: "APP_CENTER_QR_RESULT",
      value: lastResult
    }, "*");

    sent = true;

    status("ส่งข้อมูลแล้ว กำลังปิด Scanner...");

    closeScannerPage();

    return;
  }

  status("ไม่พบ API URL หรือหน้า Apps Script");

}


// หยุดกล้องเมื่อออกจากหน้า
window.addEventListener("pagehide", () => {

  if (scanner && scanning) {
    scanner.stop().catch(console.error);
  }

});

</script>

</body>
</html>
